name: CI Auditoria - Validacion de Acceso

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Verificación de sintaxis de archivos
      run: |
        echo "Validando estructura de archivos de acceso..."
        test -f index.html
        test -f app.js
        test -f style.css
        echo "Archivos principales presentes."

    - name: Escaneo de secretos (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}